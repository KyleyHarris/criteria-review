<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criteria review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Criteria review</h1>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
        <button id="tab-review" data-tab="review" class="active"
                role="tab" aria-selected="true" aria-controls="review-pane">Review</button>
        <button id="tab-standard" data-tab="standard"
                role="tab" aria-selected="false" aria-controls="standard-pane">Standard</button>
      </nav>
      <div class="counts" id="counts"></div>
      <div class="spacer"></div>
      <div class="filters">
        <select id="project"><option value="">all projects</option></select>
        <select id="status">
          <option value="needs-review">needs review</option>
          <option value="looknow">LOOK NOW (flagged)</option>
          <option value="review">NOTED (awaiting an agent)</option>
          <option value="noted">has review notes</option>
          <option value="untracked">untracked (no id/status)</option>
          <option value="derived">derived</option>
          <option value="verified">verified</option>
          <option value="accepted">accepted</option>
          <option value="">everything</option>
        </select>
        <select id="video">
          <option value="">any video</option>
          <option value="has">has recording</option>
          <option value="named">recording (named)</option>
          <option value="none">no recording</option>
        </select>
        <input id="search" type="search" placeholder="filter text" />
        <button id="view-mode" type="button" title="Flat queue or grouped tree (t)">tree</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden title="click to dismiss"></div>

    <div class="panes">
      <main id="review-pane" role="tabpanel" aria-labelledby="tab-review">
      <aside id="list" class="list" aria-label="Scenario queue"></aside>

      <section id="detail" class="detail">
        <p class="empty">Select a scenario, or press <kbd>j</kbd> to start the queue.</p>
      </section>
    </main>

    <!--
      The standard, readable beside the queue that judges against it. A reviewer
      deciding whether a scenario is written correctly should not have to leave the
      page and go find a repository to read the rule.
    -->
      <main id="standard-pane" role="tabpanel" aria-labelledby="tab-standard" hidden>
      <aside id="doc-list" class="list" aria-label="Standard documents"></aside>
      <section id="doc" class="detail md">
        <p class="empty">Select a document.</p>
      </section>
      </main>
    </div>

    <footer class="help">
      <!--
        Two sets, one shown at a time. Advertising `a` and `v` while reading would
        offer actions that deliberately do nothing here, and a key that does nothing
        teaches the reader to distrust the rest of the row.
      -->
      <span id="keys-review" class="keys">
        <span><kbd>j</kbd>/<kbd>k</kbd> next / previous</span>
        <span><kbd>a</kbd> accept</span>
        <span><kbd>v</kbd> verified</span>
        <span><kbd>n</kbd> note</span>
        <span><kbd>f</kbd> fullscreen</span>
        <span><kbd>r</kbd> reload</span>
        <span><kbd>t</kbd> tree / flat</span>
        <span><kbd>/</kbd> search</span>
      </span>
      <span id="keys-standard" class="keys" hidden>
        <span><kbd>j</kbd>/<kbd>k</kbd> next / previous document</span>
        <span><kbd>s</kbd> back to the queue</span>
      </span>
      <span id="roots" class="roots"></span>
      <span id="toast" class="toast"></span>
    </footer>

    <dialog id="note-dialog" class="note-dialog">
      <form method="dialog">
        <h3>Review note</h3>
        <p id="note-for" class="note-for"></p>
        <textarea id="note-text" rows="8" placeholder="What is wrong, or what the intent should be. Several lines are fine."></textarea>
        <menu>
          <button value="cancel">Cancel</button>
          <button value="save" class="primary">Save note</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
